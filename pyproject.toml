[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-sensor-fdir"
version = "1.0.0"
description = "Engineering sensor fault detection, isolation and identification platform for multivariate time-series."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Savio Benny Cardoso"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "torch>=2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sensor-fdir = "sensor_fdir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
